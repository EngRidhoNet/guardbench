[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "guardbench"
version = "0.1.0a0"
description = "Local-first evaluation toolkit for allow, block, and escalate guardrail decisions"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "GuardBench contributors"}]
keywords = ["llm", "evaluation", "guardrails", "ai-safety", "testing"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "alembic>=1.14,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "python-multipart>=0.0.12,<1",
  "PyYAML>=6.0,<7",
  "sqlalchemy>=2.0,<3",
  "typer>=0.12,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pytest-cov>=5,<7", "ruff>=0.7,<1"]
postgres = ["psycopg[binary]>=3.2,<4"]

[project.scripts]
guardbench = "guardbench.cli:app"

[project.urls]
Homepage = "https://github.com/EngRidhoNet/guardbench"
Documentation = "https://github.com/EngRidhoNet/guardbench#readme"
Issues = "https://github.com/EngRidhoNet/guardbench/issues"
Source = "https://github.com/EngRidhoNet/guardbench"

[tool.hatch.build.targets.wheel]
packages = ["src/guardbench"]

[tool.hatch.build.targets.wheel.force-include]
"datasets/synthetic-fintech.json" = "guardbench/templates/synthetic-fintech.json"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

